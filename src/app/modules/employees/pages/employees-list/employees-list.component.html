<header><h1 class="text-center text-mainTitle">MIS EMPLEADOS</h1></header>

<button routerLink="create" class="text-button rounded-lg bg-buttonGO p-2" >Registrar Empleado</button>

<table>
    <thead>
        <tr>
            <th>#</th>
            <th>Foto</th>
            <th>Nombres</th>
            <th>Registro</th>
            <th>Correo</th>
            <th>Opciones</th>
            <th>Estado</th>
        </tr>
    </thead>

    <tbody>
        <tr *ngFor="let employee of employeesList; let i = index">
            <td>{{ i + 1 }}</td>
            <td>
                <img *ngIf="employee.photo.startsWith('Employee'); else defaultProfile"
                [src]="env.backendBaseUrl + '/storage/' + employee.photo" alt="foto empleado">
                <ng-template #defaultProfile>
                    <img [src]="env.backendBaseUrl + '/img/employee-without-photo.png'" alt="empleado sin foto">
                </ng-template>
            </td>
            <td>{{ employee.full_name }}</td>
            <td>{{ employee.registration_date }}</td>
            <td>{{ employee.user.email }}</td>
            <td>
                <section class="flex justify-between">
                    <button class="fa-regular fa-user fa-xl"></button>
                    <button class="fa-brands fa-whatsapp fa-xl"></button>
                    <button class="fa-regular fa-pen-to-square fa-xl"></button>
                </section>
            </td>
            <td>
                <input type="checkbox" [id]="'status-' + i" class="peer hidden" [checked]="employee.user.status === 1" (change)="onToggleChange(employee.id, employee.user.status)">
                <label [for]="'status-' + i"  class="w-16 h-6 bg-stone-300 rounded inline-flex transition-colors duration-300 ease-in-out cursor-pointer peer-checked:bg-buttonGO items-center justify-center"> 
                    <span *ngIf="employee.user.status === 1">Activo</span>
                    <span *ngIf="employee.user.status !== 1">Inactivo</span>
                </label>
            </td>
        </tr>
    </tbody>
</table>
<div class="flex">
    <p-paginator (onPageChange)="loadEmployees($event)" [rows]="15" [totalRecords]="totalRecords"
        [rowsPerPageOptions]="[15, 30, 45]" />
</div>
